name: lifeflow
description: "LifeFlow - Offline-first smart productivity application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1
  geolocator: ^12.0.0
  speech_to_text: ^6.6.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  animations: ^2.0.11
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true